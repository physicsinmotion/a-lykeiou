<script>
const $=document.getElementById("app"),$$=i=>document.getElementById(i);
/* ---- Αποστολή αποτελεσμάτων στον καθηγητή (προαιρετική) ----
   Βάλε εδώ τη διεύθυνση του Google Apps Script (βλέπε ΟΔΗΓΙΕΣ) και το ίδιο κλειδί με του script.

const RESULTS_URL="https://script.google.com/macros/s/AKfycbxTsRypouAOHG01jLq_i8qeU2p6K-JSeNS60VXb19GWERRxxVUR2OQvTGKXgUkpKmDlsw/exec",RESULTS_KEY="pim-2026-xyz",APPV="pim-v56";
const st={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* fm: escape + δείκτες. _{τελ} ⇒ δείκτης· uμ, Sολ, tολ ⇒ u_μ, S_ολ, t_ολ */

/* Σχολεία για την προαιρετική επιλογή στην είσοδο. Άφησε την λίστα κενή [] για να κρυφτεί το πεδίο. */

  <div class="lgc"><label for="n">Όνομα</label><input id="n" placeholder="π.χ. Μαρία" autocomplete="given-name" value="${esc(P?P.name:"")}">

  $$("go").onclick=()=>{const name=$$("n").value.trim(),code=$$("c").value.trim().toUpperCase();
    if(!name||!code){$$("go").textContent="Συμπλήρωσε όνομα και κωδικό";return}
    P={name,code,school:$$("sc")?$$("sc").value:((P&&P.school)||"")};st.set("profile",P);home()};
}

const ICONS={kin:"🧭",dyn1:"🏎️",dyn2:"🧲",en:"⚡"},COL={kin:"#6ea8ff",dyn1:"#4cd9a0",dyn2:"#ff7a6b",en:"#FFC857"};
const RANKS=[[0,"Μαθητευόμενος"],[100,"Οδηγός"],[250,"Πιλότος"],[400,"Φυσικός"]];
const hq=q=>{let x=5381,s=q.q+"|"+q.o[q.a];for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return x};
const mlist=()=>st.get("mist:"+P.code,[]);
function practice(){const l=mlist(),pool=[];LEVELS.forEach(lv=>lv.qs.forEach(q=>{if(l.indexOf(hq(q))>=0)pool.push({...q,tip:lv.tip})}));
  if(!pool.length){home();return}start({id:"mist",title:"Εξάσκηση στα λάθη μου",sc:"const",tip:"Ξαναδιάβασε τη θεωρία της ενότητας.",qs:pool},pool)}
const KSUB=[{k:"eok",n:"Ε.Ο.Κ.",d:"Μετατόπιση, ταχύτητα, x–t",e:"🚗",g:"#2f6fdc,#4cd9a0",nn:2},{k:"meet",n:"Ασκήσεις συνάντησης",d:"Πότε και πού συναντώνται",e:"🤝",g:"#d11fa8,#ff7a18",nn:4},{k:"eomk",n:"Ε.Ο.Μ.Κ.",d:"Επιτάχυνση, u–t",e:"🚀",g:"#6a2cff,#2f6fdc",nn:2},{k:"draw",n:"Σχεδίασε",d:"Σύρε και τοποθέτησε",e:"✏️",g:"#12b886,#2f6fdc",dr:1},{k:"all",n:"Συνδυαστικές",d:"Όλα μαζί",e:"🎯",g:"#ff7a18,#ffc857"}];
function kinMenu(){clearTimer();setBg("kin");const kin=LEVELS.find(l=>l.id==="kin"),pr=prog();
  $.innerHTML=`<div class="top"><button class="ex" id="bk">‹ Αρχική</button><span class="xp">${ICONS.kin}</span></div><h1>Κινηματική</h1><p>Διάλεξε τι θέλεις να δουλέψεις. Στις Συνδυαστικές παίζουν όλα μαζί.</p><div class="tgrid">`+
  KSUB.map((c,i)=>{const r=pr[c.k==="all"?"kin":"kin:"+c.k],n=c.k==="all"?kin.qs.length:kin.qs.filter(q=>q.sub===c.k).length;return `<button class="tile" data-k="${c.k}" style="--g:linear-gradient(135deg,${c.g});--i:${i}"><span class="tw">${c.e}</span><span class="ts">${stars(r?r.stars:0)}</span><span class="tb"><b>${esc(c.n)}</b><small>${esc(c.d)} · ${c.dr?"3 σκηνές":n+" ερωτήσεις"}${r?" · Καλύτερο "+r.best+"/20":""}</small></span></button>`}).join("")+`</div>`;
  $$("bk").onclick=home;
  $.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const c=KSUB.find(x=>x.k===b.dataset.k);enter(b,UG("kin"),()=>{
    if(c.dr)return drawGame();
    if(c.k==="all")return start(kin,null);
    start({...kin,title:"Κινηματική · "+c.n,qs:kin.qs.filter(q=>q.sub===c.k),pk:"kin:"+c.k,sub:c.k,numId:"kin_"+c.k,nn:c.nn},null)})});
}
/* ===== Σχεδίασε: τοποθέτηση κομματιών σε σκηνές (πρωτότυπο) ===== */
const DCOL={v:"#FFC857",a:"#7fd1ff"},DF='font-family="Arial"',DM='style="fill:var(--mute)"';
const dCarG=(d,k)=>`<g transform="scale(${d*k},${k})"><rect x="-22" y="-3" width="44" height="12" rx="4" fill="#e0453a"/><path d="M-12 -3L-7 -11H8L14 -3z" fill="#e0453a"/><path d="M-9.5 -4L-6.2 -9H-1V-4zM1 -4V-9H7L10.5 -4z" fill="#bfe3ff"/><circle cx="-12" cy="9" r="4.6" fill="#1b1b1b"/><circle cx="12" cy="9" r="4.6" fill="#1b1b1b"/><circle cx="-12" cy="9" r="1.8" fill="#bbb"/><circle cx="12" cy="9" r="1.8" fill="#bbb"/><rect x="19" y="0" width="3.4" height="3.6" rx="1" fill="#ffe27a"/></g>`;
function dGlyph(c,w,h){ /* κομμάτι κεντραρισμένο στο (0,0) */
  if(c.t==="arr"){const d=c.d,col=DCOL[c.k],a=w/2-8;
    return `<g fill="${col}" stroke="${col}"><path d="M${-d*a} 6H${d*(a-4)}" stroke-width="3.4" stroke-linecap="round" fill="none"/><path d="M${d*a} 6l${-d*9} -6v12z" stroke="none"/><text x="0" y="-4" text-anchor="middle" font-size="15" font-weight="700" ${DF} stroke="none">${c.l}</text></g>`}

  if(c.t==="br"){const a=w/2-6;
    return `<g stroke="currentColor" fill="currentColor"><path d="M${-a} 8H${a}M${-a} 0v16M${a} 0v16" stroke-width="2.4" fill="none" stroke-linecap="round"/><text x="0" y="-1" text-anchor="middle" font-size="16" font-weight="700" ${DF} stroke="none">${c.l}</text></g>`}
  return `<text text-anchor="middle" dy=".35em" font-size="${c.fs||14}" font-weight="700" fill="currentColor" ${DF}>${c.l}</text>`;
}
function dTrain(c,w,h){const b=h-8,y0=-h/2+1;
  return `<g><rect x="${-w/2+1}" y="${y0}" width="${w-2}" height="${b}" rx="5" fill="#FFC857"/><path d="M${w/2-1} ${y0+3}l7 ${b/2-3}l-7 ${b/2-3}z" fill="#e0a22f"/><circle cx="${-w/2+12}" cy="${h/2-5}" r="4" fill="currentColor"/><circle cx="${w/2-12}" cy="${h/2-5}" r="4" fill="currentColor"/><text x="0" y="${y0+b/2+4}" text-anchor="middle" font-size="12" font-weight="700" ${DF} fill="#1a1405">${c.s}</text></g>`}

const dRoad=(y)=>`<path d="M8 ${y}H312" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity=".6"/><path d="M8 ${y+4}H312" stroke="currentColor" stroke-dasharray="10 8" opacity=".25"/>`;
const DSCENES=[
 {t:"Γκάζι ή φρένο",task:"Σε κάθε λωρίδα το αυτοκίνητο κάνει ευθύγραμμη κίνηση. Βάλε την ταχύτητα u και την επιτάχυνση α.",

 kin0:["Αρχαίος Έλληνας φιλόσοφος. Θεωρούσε ότι ένα σώμα κινείται μόνο όσο το σπρώχνει κάτι και ότι τα βαρύτερα πέφτουν ταχύτερα. Οι ιδέες του κυριάρχησαν για πάνω από 1.500 χρόνια, μέχρι να τις αμφισβητήσουν τα πειράματα του Γαλιλαίου.","Χωρίς αντίσταση αέρα, σφυρί και πούπουλο πέφτουν μαζί. Το έδειξε ο αστροναύτης David Scott στη Σελήνη το 1971.","α = g ≈ 10 m/s² για όλα τα σώματα"],
 kin3:["Απέδειξες ότι διαβάζεις διαγράμματα x–t και u–t και ξέρεις να βρίσκεις ταχύτητα, επιτάχυνση και μετατόπιση.","Το εμβαδόν κάτω από τη γραφική u–t είναι η μετατόπιση. Η κλίση της είναι η επιτάχυνση.","α = Δu/Δt  ·  u = Δx/Δt"],
 dyn10:["Άγγλος φυσικός και μαθηματικός. Στο έργο «Principia» (1687) διατύπωσε τον νόμο της αδράνειας, τον θεμελιώδη νόμο της μηχανικής και τον νόμο δράσης–αντίδρασης, καθώς και τον νόμο της παγκόσμιας έλξης.","Η μονάδα της δύναμης, το 1 N, πήρε το όνομά του.","ΣF = m·α"],
 dyn11:["Γερμανοελβετός φυσικός. Με τη Γενική Σχετικότητα (1915) εξήγησε τη βαρύτητα ως καμπύλωση του χωροχρόνου. Στην καθημερινή κλίμακα οι προβλέψεις συμφωνούν με τη βαρύτητα του Νεύτωνα.","Πήρε το βραβείο Νόμπελ Φυσικής το 1921 για την εξήγηση του φωτοηλεκτρικού φαινομένου.","B = m·g"],
 dyn12:["Στις 20 Ιουλίου 1969 ο Νιλ Άρμστρονγκ και ο Μπαζ Όλντριν περπάτησαν στη Σελήνη. Εκεί η επιτάχυνση βαρύτητας είναι περίπου 1,6 m/s², το 1/6 της γήινης, γι' αυτό τα βήματά τους έμοιαζαν με πηδήματα.","Η μάζα τους δεν άλλαξε στη Σελήνη, άλλαξε μόνο το βάρος τους.","B = m·g, με g(Σελήνη) ≈ 1,6 m/s²"],
 dyn13:["Ξέρεις πώς συνδέονται η δύναμη, η μάζα και η επιτάχυνση, και πώς κινούνται τα σώματα στην ελεύθερη πτώση.","Αν διπλασιάσεις τη δύναμη, διπλασιάζεται η επιτάχυνση. Αν διπλασιάσεις τη μάζα, υποδιπλασιάζεται.","α = ΣF/m"],
 dyn22:["Άγγλος φυσικός. Γύρω στο 1660 διατύπωσε ότι η δύναμη που ασκεί ένα ελατήριο είναι ανάλογη της επιμήκυνσής του, όσο το ελατήριο παραμένει ελαστικό. Έφτιαξε και μικροσκόπια και περιέγραψε τα κύτταρα (1665).","Η λέξη «κύτταρο» (cell) οφείλεται σ' αυτόν.","F = K·Δl"],
 dyn21:["Φλαμανδός μηχανικός και μαθηματικός. Μελέτησε με σχήματα την ισορροπία σώματος σε κεκλιμένο επίπεδο και τη σύνθεση δυνάμεων, δουλειά που συνδέεται με τον κανόνα του παραλληλογράμμου.","Τις δυνάμεις τις συνθέτουμε σαν διανύσματα, όχι σαν απλούς αριθμούς.","ΣF = √(F₁² + F₂²) για κάθετες δυνάμεις"],
 dyn20:["Μεγάλος μαθηματικός και μηχανικός των Συρακουσών. Διατύπωσε την αρχή της άνωσης και μελέτησε τον μοχλό και τις τροχαλίες.","Λέγεται ότι είπε «Δος μοι πα στω και ταν γαν κινάσω» για τη δύναμη του μοχλού.","Άνωση = βάρος του εκτοπιζόμενου υγρού"],
 dyn23:["Έμαθες να συνθέτεις και να αναλύεις δυνάμεις και να βρίσκεις τριβές και κάθετες αντιδράσεις.","Η τριβή ολίσθησης δεν εξαρτάται από το εμβαδόν επαφής.","Τ = μ·Ν  ·  Ν = m·g·συνφ στο κεκλιμένο"],
 en1:["Άγγλος φυσικός. Με πειράματα όπου ένα βαρίδι γύριζε πτερύγια μέσα σε νερό έδειξε ότι το μηχανικό έργο μετατρέπεται σε θερμότητα με σταθερή αναλογία.","1 J είναι το έργο δύναμης 1 N σε μετατόπιση 1 m.","W = F·Δx·συνθ"],
 en0:["Σκωτσέζος μηχανικός. Βελτίωσε σημαντικά την ατμομηχανή, κάνοντάς την πολύ πιο αποδοτική, και συνέβαλε στη Βιομηχανική Επανάσταση. Εισήγαγε τον όρο «ιπποδύναμη».","1 W είναι 1 J ανά δευτερόλεπτο.","P = W/Δt = F·u"],
 en2:["Γερμανίδα μαθηματικός. Το θεώρημά της (1918) δείχνει ότι κάθε συμμετρία της φύσης αντιστοιχεί σε νόμο διατήρησης. Η διατήρηση της ενέργειας συνδέεται με το ότι οι νόμοι της φυσικής δεν αλλάζουν με τον χρόνο.","Το θεώρημά της είναι θεμέλιο της σύγχρονης θεωρητικής φυσικής.","Ε_μηχ = Κ + U"],
 en3:["Ξέρεις να υπολογίζεις έργο, κινητική και δυναμική ενέργεια, ισχύ, και να εφαρμόζεις τη διατήρηση της μηχανικής ενέργειας.","Η διατήρηση ισχύει μόνο όταν δεν υπάρχουν μη συντηρητικές δυνάμεις, όπως η τριβή.","ΔΚ = ΣW"]};

const ymd=(x=new Date())=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const dnum=s=>{const[a,b,c]=s.split("-").map(Number);return Math.round(Date.UTC(a,b-1,c)/864e5)};
const wkey=()=>{const x=new Date(),m=new Date(x);m.setDate(x.getDate()-(x.getDay()+6)%7);return ymd(m)};

const dset=x=>st.set("daily:"+P.code,x);
function dailyAlive(x){if(!x.last)return 0;const g=dnum(ymd())-dnum(x.last);return g<=1||(g===2&&x.pass>0)?x.streak:0}

 if(g===1)x.streak++;else if(g===2&&x.pass>0){x.pass--;x.streak++;m=" (χρησιμοποιήθηκε το πάσο 🛡️)"}else x.streak=1;
 x.last=t;x.best=Math.max(x.best,x.streak);dset(x);return`🔥 Σερί ${x.streak} ${x.streak===1?"ημέρα":"ημέρες"}${m}`}

 const pool=shuffle(all.filter(x=>m[hq(x.q)]&&m[hq(x.q)].d<=now)).slice(0,3).map(x=>({...x.q,tip:x.l.tip})),ids=new Set(pool.map(hq)),stt=st.get("stat:"+P.code,{});

  $$("sh").onclick=async()=>{const t=`${P.name} | ${P.code} | ${lv.title} | ${g}/20 | ${S.xp} XP`;
    try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);$$("sh").textContent="Αντιγράφηκε!"}}catch(e){}};
  if($$("rv"))$$("rv").onclick=()=>review(S.wrong,finish);
  if($$("ag"))$$("ag").onclick=()=>start(lv,S.wrong.map(w=>w.q));
  if($$("bw"))$$("bw").onclick=()=>world(S.quest.w);$$("rd").onclick=()=>start(lv,null);if($$("km"))$$("km").onclick=kinMenu;$$("hm").onclick=home;
}

function review(items,back){
  $.innerHTML=`<h1>Τα λάθη μου</h1>`+items.map(w=>`<div class="card"><b>${esc(w.q.q)}</b>
   ${w.mine?`<div class="bad">Η απάντησή σου: ${esc(w.mine)}</div>`:""}<div class="good">Σωστό: ${esc(w.right||w.q.o[w.q.a])}</div>
   <div class="why">${fm(w.q.why)}</div></div>`).join("")+`<button class="btn ghost" id="bk">Πίσω</button>`;
  $$("bk").onclick=back;
}

/* ---- Challenge μήνα: ίδιες 10 ερωτήσεις για όλους, κατάταξη με ψευδώνυμα, νέο σετ κάθε μήνα ---- */
const CHAL_TRIES=5,CHAL_T=30,CHAL_Q={kin:10}/* μόνο ύλη που έχουν κάνει: πρόσθεσε dyn1/dyn2/en όταν μπουν στα επόμενα κεφάλαια, π.χ. {kin:4,dyn1:3,dyn2:2,en:1} */;
const MONTHS_GR=["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος","Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];
const chM=d=>{d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const chPrev=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return chM(d)};
const chName=m=>MONTHS_GR[+m.slice(5)-1]+" "+m.slice(0,4);
const chH=s=>{let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;x^=x>>>16;x=Math.imul(x,0x45d9f3b);x^=x>>>16;x=Math.imul(x,0x45d9f3b);x^=x>>>16;return x>>>0};
const chMed=i=>["🥇","🥈","🥉"][i]||(i+1)+".";
const chFmt=s=>Math.floor(s/60)+"′"+String(s%60).padStart(2,"0")+"″";
function chQs(m){const out=[];LEVELS.forEach(l=>{const n=CHAL_Q[l.id]||0;if(!n)return;
  let c=l.qs.filter(q=>q.diff>=2&&!q.tf&&!q.num);if(c.length<n)c=l.qs.filter(q=>!q.num);
  c.map(q=>({q:q,k:chH(m+"|"+hq(q))})).sort((a,b)=>a.k-b.k).slice(0,n).forEach(x=>out.push({...x.q,tip:l.tip}))});return out}
const cpt=()=>{S.pts=(S.pts||0)+100+Math.round(50*Math.max(S.left||0,0)/(S.tl||1))};
const chRec=m=>st.get("chal:"+P.code+":"+m,{tries:0,best:null});
const MONTHS_GEN=["Ιανουαρίου","Φεβρουαρίου","Μαρτίου","Απριλίου","Μαΐου","Ιουνίου","Ιουλίου","Αυγούστου","Σεπτεμβρίου","Οκτωβρίου","Νοεμβρίου","Δεκεμβρίου"];
const CHAL_START="2026-12"/* πρώτος επίσημος μήνας. Για δοκιμή από τον καθηγητή: άνοιξε την εφαρμογή με #test στο τέλος του link */,chOpen=()=>chM()>=CHAL_START||/test/.test(location.hash);
function chalSoon(){setBg("dyn1");const n=new Date(),t=new Date(+CHAL_START.slice(0,4),+CHAL_START.slice(5)-1,1),days=Math.max(1,Math.ceil((t-n)/864e5));
  $.innerHTML=`<div class="top"><button class="ex" id="bk">‹ Αρχική</button><span class="xp">🏆</span></div><h1>Challenge</h1><p>Το πρώτο μηνιαίο Challenge ξεκινά την <b>1η ${MONTHS_GEN[+CHAL_START.slice(5)-1]}</b> (σε ${days} ${days===1?"ημέρα":"ημέρες"}).</p><p>Θα έχει 10 ερωτήσεις με χρονόμετρο, 5 προσπάθειες και κατάταξη με ψευδώνυμο. Μέχρι τότε εξασκήσου στις Αποστολές και τις Κάρτες!</p>`;$$("bk").onclick=home}
function showWelcome(){if($$("wov"))return;const d=document.createElement("div");d.className="wov";d.id="wov";
  d.innerHTML=`<div class="wc"><button class="wx" id="wx" aria-label="Κλείσιμο">✕</button><h2>Καλώς ήρθες στο Physics in Motion 🚀</h2>
  <p>📲 <b>Βάλ' την στην αρχική οθόνη</b>, για να ανοίγει σαν κανονική εφαρμογή.<br>• <b>iPhone:</b> άνοιξε το link στο Safari → κουμπί «Κοινοποίηση» (τετράγωνο με βέλος) → «Προσθήκη στην αρχική οθόνη».<br>• <b>Android:</b> στο Chrome → ⋮ (τρεις τελείες) → «Εγκατάσταση εφαρμογής» ή «Προσθήκη στην αρχική οθόνη».</p>
  <p>🗺️ <b>Αποστολή:</b> λύνεις πίστες, κερδίζεις αστέρια και XP και ξεκλειδώνεις κάρτες και χρώματα.</p>
  <p>🏆 <b>Challenge:</b> κάθε μήνα το ίδιο σετ 10 ερωτήσεων για όλους, με χρονόμετρο και 5 προσπάθειες. Στην κατάταξη φαίνεται μόνο το ψευδώνυμό σου.</p>
  <p>🔑 Ο <b>κωδικός</b> σου είναι προσωπικός, μην τον δίνεις σε άλλους. Ο καθηγητής σου βλέπει τα αποτελέσματα για να σε βοηθά στο μάθημα.</p>
  <p>ℹ️ Τις οδηγίες τις βρίσκεις πάντα στο <b>Προφίλ → Οδηγίες</b>.</p>
  <button class="btn primary" id="wok">Κατάλαβα, πάμε!</button></div>`;
  document.body.appendChild(d);const cl=()=>{d.remove();if(P)st.set("wel:"+P.code,1)};$$("wx").onclick=cl;$$("wok").onclick=cl}
function chBanner(){const m=chM(),r=chRec(m),left=CHAL_TRIES-r.tries;
  if(!chOpen())return `<button class="chb lk" id="ch"><span>🏆</span><div><b>Challenge · σύντομα</b><small>Ξεκινά την 1η ${MONTHS_GEN[+CHAL_START.slice(5)-1]}</small></div></button>`;
  return `<button class="chb" id="ch"><span>🏆</span><div><b>Challenge ${MONTHS_GR[+m.slice(5)-1]}</b><small>${r.best?"Καλύτερό σου: "+r.best.pts+" πόντοι · ":""}${left>0?left+" προσπάθειες":"Ολοκλήρωσες τις προσπάθειες"}</small></div></button>`}
function chFetch(m){if(!RESULTS_URL)return Promise.resolve(null);
  const u=RESULTS_URL+(RESULTS_URL.indexOf("?")<0?"?":"&")+"action=board&month="+m+"&code="+encodeURIComponent(P.code);
  return Promise.race([fetch(u).then(r=>r.json()),new Promise((_,j)=>setTimeout(j,7000))]).catch(()=>null)}
function chBoard(d){const el=$$("bd");if(!el)return;
  if(!d||!d.top){el.innerHTML=RESULTS_URL?`<p style="color:var(--mute)">Δεν φορτώθηκε η κατάταξη. Έλεγξε τη σύνδεσή σου και ξαναδοκίμασε.</p>`:`<p style="color:var(--mute)">Η κατάταξη θα εμφανιστεί μόλις συνδεθεί η εφαρμογή με τον καθηγητή σου. Οι πόντοι σου αποθηκεύονται κανονικά.</p>`;return}
  if(!d.top.length){el.innerHTML=`<p style="color:var(--mute)">Κανείς δεν έπαιξε ακόμα. Γίνε ο πρώτος!</p>`;return}
  const row=(x,i)=>`<div class="chr${x[4]?" me":""}"><i>${chMed(i)}</i><em>${esc(x[0])}</em><b>${x[1]}</b><small>${x[2]}/10 · ${chFmt(x[3])}</small></div>`;
  let h=d.top.slice(0,10).map(row).join("");
  if(d.me&&d.me.rank>10)h+=`<div class="chr me"><i>${d.me.rank}.</i><em>Εσύ</em><b>${d.me.pts}</b><small>από ${d.total}</small></div>`;
  el.innerHTML=h+`<p style="color:var(--mute);font-size:13px">${d.total} παίκτες συνολικά</p>`}
function chBadges(){const b=st.get("chb:"+P.code,{}),ks=Object.keys(b).sort();return ks.length?ks.map(k=>chMed(b[k]-1)+" "+chName(k)).join(" · "):""}
function chalScreen(){setBg("dyn1");const m=chM(),pp=pget(),r=chRec(m),left=CHAL_TRIES-r.tries,n=new Date(),days=Math.ceil((new Date(n.getFullYear(),n.getMonth()+1,1)-n)/864e5);
  if(!pp.nick)return chNick();
  $.innerHTML=`<div class="top"><button class="ex" id="bk">‹ Αρχική</button><span class="xp">🏆</span></div><h1>Challenge ${chName(m)}</h1>
   <p>Οι ίδιες 10 ερωτήσεις για όλους, ${CHAL_T}″ ανά ερώτηση. Κάθε σωστή με την πρώτη δίνει 100 πόντους και μέχρι 50 μπόνους ταχύτητας. Έχεις ${CHAL_TRIES} προσπάθειες και μετράει η καλύτερη. Νέο σετ κάθε μήνα (σε ${days} ${days===1?"ημέρα":"ημέρες"}).</p>
   <div class="card">Το ψευδώνυμό σου: <b>${esc(pp.nick)}</b> <button class="ex" id="nk">Αλλαγή</button>${r.best?`<br><small>Καλύτερό σου: ${r.best.pts} πόντοι · ${r.best.ok}/10 · ${chFmt(r.best.secs)}</small>`:""}<div id="bgs" style="margin-top:6px">${chBadges()}</div></div>
   <button class="btn primary" id="cp" ${left<=0?"disabled":""}>${left>0?"▶ Παίξε ("+left+(left===1?" προσπάθεια":" προσπάθειες")+")":"Ολοκλήρωσες τις προσπάθειές σου"}</button>
   <h3>Κατάταξη μήνα</h3><div id="bd"><p style="color:var(--mute)">Φόρτωση…</p></div>`;
  $$("bk").onclick=home;$$("nk").onclick=chNick;if(left>0)$$("cp").onclick=chalStart;
  chFetch(m).then(chBoard);
  if(st.get("chbchk:"+P.code,"")!==m){const pm=chPrev();chFetch(pm).then(d=>{if(!d)return;st.set("chbchk:"+P.code,m);if(d.me&&d.me.rank>=1&&d.me.rank<=3){const b=st.get("chb:"+P.code,{});b[pm]=d.me.rank;st.set("chb:"+P.code,b);const e=$$("bgs");if(e)e.innerHTML=chBadges()}})}}
function chNick(){setBg("dyn1");const A=["Γρήγορο","Λαμπρό","Ατρόμητο","Κοσμικό","Φωτεινό","Ανήσυχο"],B=["Φωτόνιο","Ηλεκτρόνιο","Νετρόνιο","Πρωτόνιο","Κβάντο","Άτομο"],pp=pget();
  const def=pp.nick||A[Math.floor(Math.random()*A.length)]+" "+B[Math.floor(Math.random()*B.length)]+" "+(10+Math.floor(Math.random()*90));
  $.innerHTML=`<div class="top"><button class="ex" id="bk">‹ Πίσω</button><span class="xp">🏆</span></div><h1>Διάλεξε ψευδώνυμο</h1><p>Στην κατάταξη βλέπουν όλοι μόνο το ψευδώνυμο, όχι το όνομά σου. Μην γράψεις το πραγματικό σου όνομα ή επώνυμο.</p><input class="chn" id="ni2" maxlength="24" value="${esc(def)}" autocomplete="off" autocapitalize="off" spellcheck="false"><p id="ne" class="bad"></p><button class="btn primary" id="ok">Αποθήκευση</button>`;
  $$("bk").onclick=pp.nick?chalScreen:home;
  $$("ok").onclick=()=>{const v=$$("ni2").value.replace(/\s+/g," ").trim();if(v.length<3){$$("ne").textContent="Τουλάχιστον 3 χαρακτήρες.";return}
    const q=pget();q.nick=v.slice(0,24);st.set("prof:"+P.code,q);chalScreen()}}
function chalStart(){const m=chM(),k="chal:"+P.code+":"+m,r=chRec(m);if(r.tries>=CHAL_TRIES)return chalScreen();
  r.tries++;st.set(k,r);const qs=chQs(m);
  start({id:"chal",title:"Challenge "+chName(m),sc:"const",tip:"Διάβασε ξανά τη θεωρία της ενότητας.",qs:qs},qs);
  S.chal={m:m,t0:Date.now()};S.pts=0;S.retry=false;S.tl=CHAL_T;S.left=CHAL_T;S.tqi=-1;quiz()}
function chalFinish(){clearTimer();clearTimeout(S.fto);const c=S.chal,n=S.qs.length,k="chal:"+P.code+":"+c.m,r=chRec(c.m);
  if(S.csecs==null){S.csecs=Math.round((Date.now()-c.t0)/1000);const b=r.best;S.cbet=!b||S.pts>b.pts||(S.pts===b.pts&&S.csecs<b.secs);if(S.cbet){r.best={pts:S.pts,ok:S.ok,secs:S.csecs};st.set(k,r)}
    S.crep=report({type:"challenge",id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:new Date().toISOString(),name:P.name,code:P.code,nick:pget().nick||"",month:c.m,pts:S.pts,ok:S.ok,n:n,secs:S.csecs,v:APPV});sfx.done(S.ok/n>=.9?3:S.ok/n>=.7?2:S.ok/n>=.4?1:0)}
  const best=r.best||{pts:S.pts};
  $.innerHTML=`<h1>Τέλος, ${esc(P.name)}!</h1><div class="big">${S.pts}<small style="font-size:22px;color:var(--mute)"> πόντοι</small></div><p>${S.ok} σωστές από ${n} · ${chFmt(S.csecs)}</p>${S.cbet?`<p class="good">Νέο προσωπικό ρεκόρ του μήνα!</p>`:`<p>Το καλύτερό σου: ${best.pts} πόντοι</p>`}${S.crep?`<p style="color:var(--mute);font-size:14px">${S.crep.replace("στάλθηκε στον καθηγητή","μπήκε στην κατάταξη")}</p>`:""}
   <button class="btn primary" id="bd2">🏆 Δες την κατάταξη</button>${S.wrong.length?`<button class="btn" id="rv">Δες τα λάθη μου (${S.wrong.length})</button>`:""}<button class="btn ghost" id="hm">Αρχική</button>`;
  $$("bd2").onclick=()=>setTimeout(chalScreen,0);if($$("rv"))$$("rv").onclick=()=>review(S.wrong,chalFinish);$$("hm").onclick=home}

/* ---- Συναίνεση για ανώνυμη χρήση σε εκπαιδευτική έρευνα (προαιρετική) ---- */
const CONS_V=1,consGet=()=>st.get("cons:"+P.code,null);
function consSet(a){st.set("cons:"+P.code,{v:CONS_V,a:!!a,ts:Date.now()});

  $.innerHTML=`<div class="top"><span></span><span class="xp">🔬</span></div><h1>Βοήθησέ μας να βελτιώσουμε την εφαρμογή</h1>

   <p>Είναι <b>προαιρετικό</b> και δεν αλλάζει τίποτα στο παιχνίδι. Μπορείς να αλλάξεις γνώμη όποτε θέλεις από το Προφίλ. Αν είσαι κάτω των 15 ετών, ρώτα πρώτα τον γονέα ή κηδεμόνα σου.</p>
   <button class="btn primary" id="cy">✅ Συμφωνώ</button><button class="btn" id="cn">Όχι, ευχαριστώ</button>`;

flush();
P?home():login();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

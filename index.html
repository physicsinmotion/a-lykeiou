 dyn20:["Άγγλος φυσικός. Γύρω στο 1660 διατύπωσε ότι η δύναμη που ασκεί ένα ελατήριο είναι ανάλογη της επιμήκυνσής του, όσο το ελατήριο παραμένει ελαστικό. Έφτιαξε και μικροσκόπια και περιέγραψε τα κύτταρα (1665).","Η λέξη «κύτταρο» (cell) οφείλεται σ' αυτόν.","F = K·Δl"],

 dyn22:["Μεγάλος μαθηματικός και μηχανικός των Συρακουσών. Διατύπωσε την αρχή της άνωσης και μελέτησε τον μοχλό και τις τροχαλίες.","Λέγεται ότι είπε «Δος μοι πα στω και ταν γαν κινάσω» για τη δύναμη του μοχλού.","Άνωση = βάρος του εκτοπιζόμενου υγρού"],

 scene(k){switch(k){
  case"acc":tone(80,0,1.4,"sawtooth",.03,240);break;
  case"brake":tone(240,0,1.4,"sawtooth",.03,70);break;
  case"const":tone(120,0,.9,"sawtooth",.028);break;
  case"back":tone(120,0,.5,"sawtooth",.028);tone(140,.6,.5,"sawtooth",.028);break;
  case"push":case"slide":tone(75,0,.8,"square",.03,50);break;
  case"fall":case"fall2":tone(900,0,1,"sine",.04,250);break;
  case"up":tone(300,0,.6,"sine",.04,800);tone(800,.6,.8,"sine",.04,250);break;
  case"incline":tone(110,0,1.3,"sawtooth",.028,200);break;
  case"pair":tone(620,0,.08,"square",.035);tone(520,.12,.08,"square",.035);break;
  default:tone(200,0,1.2,"sine",.035,260)}}};
function auto(t){t=t.toLowerCase();for(const[x,s]of[[/σφυρ|πούπουλ/,"fall2"],[/κατακόρυφα προς τα πάνω|εκτοξεύ|ανώτατο/,"up"],[/κεκλιμέν|πλάγι/,"incline"],[/δράση|αντίδραση|τρίτο|μαγνήτ/,"pair"],[/ελεύθερ|πέφτ|πτώση/,"fall"],[/τριβ|ολισθ/,"slide"],[/έργο|ενέργει|ισχύ|δύναμη f|δύναμης f|βάρους/,"push"],[/επιβραδ|φρέν|σταματ/,"brake"],[/επιταχ|ξεκιν|ηρεμ/,"acc"],[/κύκλ|περιστρ/,"circ"],[/μετατόπιση|διάστημα|επιστρ|ημικύκλ/,"back"],[/ταχύτητα|ομαλή/,"const"]])if(x.test(t))return s}
function scene(q,lv){const s=q.sc||auto(q.q)||lv.sc,c=(d,e,a,i)=>`<div class="sc road"><span class="car${i?"":" svgc"}" style="--d:${d};--e:${e};--a:${a||"normal"}">${i||CAR(carC())}</span></div>`;
  switch(s){
  case"back":return c("3s","ease-in-out","alternate");
  case"const":return c("3.5s","linear");
  case"acc":return c("3.5s","cubic-bezier(.6,0,1,.7)");
  case"brake":return c("3.5s","cubic-bezier(0,.4,.4,1)");
  case"push":return c("3.5s","linear","normal","📦⬅️");
  case"slide":return c("3s","cubic-bezier(0,.4,.4,1)","normal","📦");
  case"fall":return `<div class="sc fall"><span class="ob" style="left:45%">⚽</span></div>`;
  case"fall2":return `<div class="sc fall"><span class="ob" style="left:30%">🔨</span><span class="ob" style="left:60%">🪶</span></div>`;
  case"up":return `<div class="sc fall"><span class="ob up" style="left:45%">⚽</span></div>`;
  case"incline":return `<div class="sc inc"><div class="rp"><span class="bx">📦</span></div></div>`;
  case"pair":return `<div class="sc road"><span class="pl">🧲</span><span class="pr">🧲</span></div>`;
  default:return `<div class="sc ring"><div class="arm"><i></i></div></div>`}}
function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const cols=["#FFC857","#4cd9a0","#ff7a6b","#6ea8ff","#F2EEE3"];
  for(let i=0;i<44;i++){const e=document.createElement("span");e.className="cf";
    e.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%5]};animation-delay:${Math.random()*.35}s;animation-duration:${1.3+Math.random()*.8}s`;
    document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}}
function quiz(){
  const q=S.qs[S.i],n=S.qs.length,pos=S.ok/n*100,right=S.state==="right",wr=S.state==="wrong";setBg(S.lv.id);
  const sk=q.sc||auto(q.q)||S.lv.sc;if(S.sndI!==S.i&&!right&&!wr){S.sndI=S.i;sfx.scene(sk)}
  $.innerHTML=`<div class="top"><button class="ex" id="ex">✕ Έξοδος</button><button class="ex" id="sn" aria-label="Ήχοι και δόνηση">${sndOn()?"🔊":"🔇"}</button><span class="xp">${S.xp} XP</span></div>
   <div class="track"><div class="dot" id="dot" style="left:calc(${pos}% - ${pos*0.2}px)"><span style="display:inline-block;${vh(S.lv.id)[1]}">${vh(S.lv.id)[0]}</span></div><em>🏁</em></div>
   <div class="combo">${S.quest&&S.quest.boss?"👹 "+"❤️".repeat(Math.max(S.hearts,0))+"🖤".repeat(3-Math.max(S.hearts,0))+(S.streak>1?"  🔥 "+S.streak:""):(S.streak>1?"🔥 Σερί "+S.streak:"")}</div>${scene(q,S.lv)}
   ${q.tr?`<div class="tr">Τράπεζα Θεμάτων · ${esc(q.tr)}</div>`:""}<div class="q">${esc(q.q)}</div>${q.svg?`<div class="fig">${q.svg}</div>`:""}`+
   q.opts.map((o,k)=>`<button class="btn opt${right&&k===q.ans?" right":S.dis.has(k)?" wrong":""}" data-k="${k}" ${right||S.dis.has(k)?"disabled":""}>${esc(o)}</button>`).join("")+
   (right?`<div class="why"><b>Σωστό!</b> ${S.quest?GUIDE[S.quest.w][0]+" "+OKL[S.i%3]+" ":""}${esc(q.why||"")}</div><button class="ex fb" id="fb">Διαφωνείς με την απάντηση; Στείλε σχόλιο</button><button class="btn primary" id="nx">${S.i+1<n?"Επόμενη":"Δες το αποτέλεσμα"}</button>`:
    wr?`<div class="why"><b>Λάθος.</b> ${S.quest?GUIDE[S.quest.w][0]+" "+BADL[S.i%3]+" ":""}Βοήθεια: ${esc(q.tip||S.lv.tip)}</div><button class="ex fb" id="fb">Διαφωνείς με την απάντηση; Στείλε σχόλιο</button><button class="btn primary" id="rt">Προσπάθησε ξανά</button><button class="btn" id="nx">Επόμενη</button>`:"");
  if(!right&&!wr||wr)$.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
    if(k===q.ans){if(!S.missed){S.ok++;S.streak++;S.xp+=10+Math.min(S.streak-1,5)*2;mist(q,0)}else S.xp+=5;S.state="right";quiz();confetti();sfx.right(S.missed?0:S.streak)}
    else{if(!S.missed){S.missed=true;S.streak=0;mist(q,1);if(S.hearts!=null)S.hearts--;S.wrong.push({q:q.orig,mine:q.opts[k],right:q.opts[q.ans]})}
      S.dis.add(k);S.state="wrong";quiz();$$("dot").classList.add("miss");sfx.wrong();if(S.hearts!=null&&S.hearts<=0){S.failed=1;setTimeout(finish,1100)}}});
  if($$("rt"))$$("rt").onclick=()=>{S.state=null;quiz()};
  if($$("fb"))$$("fb").onclick=()=>feedback(q);
  if($$("sn"))$$("sn").onclick=()=>{st.set("snd",!sndOn());quiz()};
  $$("ex").onclick=exitAsk;
  if($$("nx"))$$("nx").onclick=()=>{S.state=null;S.dis=new Set();S.missed=false;S.i++;S.i<n?quiz():finish()};
}

function feedback(q){$.innerHTML=`<h1>Σχόλιο για την ερώτηση</h1><p>${esc(q.q)}</p><textarea id="cm" rows="5" placeholder="Γιατί διαφωνείς; Ποια απάντηση νομίζεις ότι είναι σωστή;"></textarea><button class="btn primary" id="sd">Στείλε</button><button class="btn ghost" id="bk">Πίσω</button>`;
  $$("bk").onclick=quiz;
  $$("sd").onclick=async()=>{const c=$$("cm").value.trim();if(!c)return;
    const t=`ΣΧΟΛΙΟ | ${P.name} | ${P.code} | ${S.lv.title}${q.tr?" | Τράπεζα "+q.tr:""} | ${q.q} | Σωστή (σύστημα): ${q.o[q.a]} | ${c}`;
    try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);$$("sd").textContent="Αντιγράφηκε! Στείλ' το στον καθηγητή"}}catch(e){}};}
function exitAsk(){$.innerHTML=`<h1>Θέλεις να σταματήσεις;</h1><p>Η πρόοδος αυτής της προσπάθειας δεν θα αποθηκευτεί.</p><button class="btn primary" id="kp">Συνέχισε το παιχνίδι</button><button class="btn" id="qt">Έξοδος στην αρχική</button>`;$$("kp").onclick=quiz;$$("qt").onclick=home}
function finish(){
  const n=S.qs.length,g=grade(S.ok,n),s=S.ok/n>=.9?3:S.ok/n>=.7?2:S.ok/n>=.4?1:0,lv=S.lv;sfx.done(s);
  if(!S.retry){const pr=prog(),o=pr[lv.id]||{best:0,stars:0,xp:0};
    pr[lv.id]={best:Math.max(o.best,g),stars:Math.max(o.stars,s),xp:Math.max(o.xp,S.xp)};st.set("prog:"+P.code,pr);
    st.set("wrong:"+P.code+":"+lv.id,S.wrong.map(w=>w.q))}
  const qrew=S.quest?(S.qrew||(S.qrew=questReward(s))):"";S.dm=S.dm??((S.qs.length>=5&&S.i>=4)?dailyDone():"");$.innerHTML=`<h1>${s===3?"Τέλειο":"Τελείωσες"}, ${esc(P.name)}!</h1><div class="big">${g}<small style="font-size:22px;color:var(--mute)"> /20</small></div>
   <p>${stars(s)} · ${S.ok} σωστές από ${n} · ${S.xp} XP</p>${S.dm?`<p class="good">${S.dm}</p>`:""}${qrew}
   <button class="btn primary" id="sh">Στείλε το αποτέλεσμα στον καθηγητή</button>
   ${S.wrong.length?`<button class="btn" id="rv">Δες τα λάθη μου (${S.wrong.length})</button><button class="btn" id="ag">Ξαναπαίξε μόνο τα λάθη</button>`:""}
   <button class="btn ghost" id="rd">Παίξε ξανά την ενότητα</button><button class="btn ghost" id="hm">Αρχική</button>`;
  $$("sh").onclick=async()=>{const t=`${P.name} | ${P.code} | ${lv.title} | ${g}/20 | ${S.xp} XP`;
    try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);$$("sh").textContent="Αντιγράφηκε!"}}catch(e){}};
  if($$("rv"))$$("rv").onclick=()=>review(S.wrong,finish);
  if($$("ag"))$$("ag").onclick=()=>start(lv,S.wrong.map(w=>w.q));
  if($$("bw"))$$("bw").onclick=()=>world(S.quest.w);$$("rd").onclick=()=>start(lv,null);$$("hm").onclick=home;
}

function review(items,back){
  $.innerHTML=`<h1>Τα λάθη μου</h1>`+items.map(w=>`<div class="card"><b>${esc(w.q.q)}</b>
   ${w.mine?`<div class="bad">Η απάντησή σου: ${esc(w.mine)}</div>`:""}<div class="good">Σωστό: ${esc(w.right||w.q.o[w.q.a])}</div>
   <div class="why">${esc(w.q.why)}</div></div>`).join("")+`<button class="btn ghost" id="bk">Πίσω</button>`;
  $$("bk").onclick=back;
}
P?home():login();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
